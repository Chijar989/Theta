<script>
const screen = document.getElementById("screen");
let inputActive = false;
let currentInput = "";

/* Fake textfiles */
const files = {
    test1: "This is Test1.\nA clue lies within.",
    test2: "This is Test2.\nAnother piece of the puzzle.",
    test3: "This is Test3.\nYou're getting closer."
};

/* Loading animation */
async function bootSequence() {
    screen.textContent = "Booting System...\n\n[";
    let bar = "";
    for (let i = 0; i < 30; i++) {
        bar += "#";
        screen.textContent = "Booting System...\n\n[" + bar.padEnd(30, " ") + "]";
        await new Promise(r => setTimeout(r, 80));
    }
    screen.textContent += "\n\nSystem Ready.\nType 'help' for commands.\n\n";
    newPrompt();
}

/* Show prompt */
function newPrompt() {
    inputActive = true;
    currentInput = "";

    // Create a fresh prompt line
    const line = document.createElement("div");
    line.innerHTML = `C:\\> <span class="input"></span><span class="cursor"></span>`;
    screen.appendChild(line);

    screen.scrollTop = screen.scrollHeight;
}

/* Process commands */
function runCommand(cmd) {
    const lower = cmd.toLowerCase();

    if (lower === "help") {
        return "Commands:\nhelp\ndir\nopen <filename>\nclear";
    }

    if (lower === "dir") {
        return "Files:\n" + Object.keys(files).map(f => f.toUpperCase()).join("\n");
    }

    if (lower.startsWith("open ")) {
        const name = lower.split(" ")[1];
        return files[name] || "File not found.";
    }

    if (lower === "clear") {
        screen.textContent = "";
        return "";
    }

    return "Unknown command.";
}

/* Keyboard input */
document.addEventListener("keydown", e => {
    if (!inputActive) return;

    const inputSpan = screen.querySelector(".input:last-of-type");

    if (e.key === "Backspace") {
        currentInput = currentInput.slice(0, -1);
        inputSpan.textContent = currentInput;
        return;
    }

    if (e.key === "Enter") {
        inputActive = false;

        // Remove cursor from this line only
        const cursor = screen.querySelector(".cursor:last-of-type");
        if (cursor) cursor.remove();

        const output = runCommand(currentInput);

        // Append output
        const out = document.createElement("div");
        out.textContent = output;
        screen.appendChild(out);

        screen.appendChild(document.createElement("br"));
        newPrompt();
        return;
    }

    if (e.key.length === 1) {
        currentInput += e.key;
        inputSpan.textContent = currentInput;
    }
});

bootSequence();
</script>
