<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scrolling Terminal</title>
<style>
    body {
        background: black;
        color: #00ff99;
        font-family: monospace;
        font-size: 18px;
        overflow: hidden;
    }
    #stream {
        position: absolute;
        width: 100%;
        height: 100%;
        white-space: pre;
    }
</style>
</head>
<body>
<div id="stream"></div>

<script>
const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&*";
const stream = document.getElementById("stream");

function randomLine() {
    let line = "";
    for (let i = 0; i < 80; i++)
        line += chars[Math.floor(Math.random() * chars.length)];
    return line;
}

setInterval(() => {
    stream.textContent += randomLine() + "\n";
    if (stream.textContent.split("\n").length > 40)
        stream.textContent = stream.textContent.split("\n").slice(1).join("\n");
}, 50);
</script>
</body>
</html>
