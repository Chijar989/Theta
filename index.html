<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CRT Terminal</title>

<style>
@font-face {
    font-family: "GlassTTY";
    src: url("https://cdn.jsdelivr.net/gh/ayunami2000/glass-tty-font/Glass_TTY_VT220.ttf");
}

body {
    background: #000;
    margin: 0;
    overflow: hidden;
    font-family: "GlassTTY", monospace;
    font-size: 14px;
    color: #33ff33;
    text-shadow: 0 0 4px #33ff33;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    transform: perspective(900px) translateZ(50px) rotateX(2deg);
}

#screen {
    width: 90%;
    height: 90%;
    padding: 20px;
    white-space: pre-wrap;
    overflow-y: auto;
    position: relative;
    filter: blur(0.6px);
    text-shadow:
        0 0 4px #33ff33,
        1px 0 1px rgba(0,255,0,0.3);
}

/* Scanlines */
#screen::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,0) 2px,
        rgba(0,255,0,0.04) 3px
    );
    mix-blend-mode: overlay;
}

/* Vignette */
#screen::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.6) 100%);
}

.cursor {
    display: inline-block;
    width: 10px;
    height: 16px;
    background: #33ff33;
    animation: blink 0.7s steps(1) infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}
</style>
</head>

<body>
<div id="screen"></div>

<script>
const screen = document.getElementById("screen");
let inputActive = false;
let currentInput = "";

/* Fake textfiles */
const files = {
    test1: "This is Test1.\nA clue lies within.",
    test2: "This is Test2.\nAnother piece of the puzzle.",
    test3: "This is Test3.\nYou're getting closer."
};

/* Loading animation */
async function bootSequence() {
    screen.textContent = "Booting System...\n\n[";
    let bar = "";
    for (let i = 0; i < 30; i++) {
        bar += "#";
        screen.textContent = "Booting System...\n\n[" + bar.padEnd(30, " ") + "]";
        await new Promise(r => setTimeout(r, 80));
    }
    screen.textContent += "\n\nSystem Ready.\nType 'help' for commands.\n\n";
    newPrompt();
}

/* Show prompt */
function newPrompt() {
    inputActive = true;
    currentInput = "";

    const line = document.createElement("div");
    line.innerHTML = `C:\\> <span class="input"></span><span class="cursor"></span>`;
    screen.appendChild(line);

    screen.scrollTop = screen.scrollHeight;
}

/* Process commands */
function runCommand(cmd) {
    const lower = cmd.toLowerCase().trim();

    if (lower === "") {
        // Empty command: just do nothing (new prompt already created)
        return "";
    }

    if (lower === "help") {
        return "Commands:\nhelp\ndir\nopen <filename>\nclear";
    }

    if (lower === "dir") {
        return "Files:\n" + Object.keys(files).map(f => f.toUpperCase()).join("\n");
    }

    if (lower.startsWith("open ")) {
        const name = lower.split(" ")[1];
        return files[name] || "File not found.";
    }

    if (lower === "clear") {
        screen.textContent = "";
        return "";
    }

    return "Unknown command.";
}

/* Keyboard input */
document.addEventListener("keydown", e => {
    if (!inputActive) return;

    const inputs = screen.querySelectorAll(".input");
    const cursors = screen.querySelectorAll(".cursor");
    const inputSpan = inputs[inputs.length - 1];

    if (!inputSpan) return;

    if (e.key === "Backspace") {
        e.preventDefault();
        currentInput = currentInput.slice(0, -1);
        inputSpan.textContent = currentInput;
        return;
    }

    if (e.key === "Enter") {
        e.preventDefault();
        inputActive = false;

        const cursor = cursors[cursors.length - 1];
        if (cursor) cursor.remove();

        const output = runCommand(currentInput);

        if (output !== "") {
            const out = document.createElement("div");
            out.textContent = output;
            screen.appendChild(out);
        }

        screen.appendChild(document.createElement("br"));
        newPrompt();
        return;
    }

    if (e.key.length === 1) {
        currentInput += e.key;
        inputSpan.textContent = currentInput;
    }

    screen.scrollTop = screen.scrollHeight;
});

bootSequence();
</script>

</body>
</html>
