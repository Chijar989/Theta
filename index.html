<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CRT Terminal</title>

<style>
@font-face {
    font-family: "GlassTTY";
    src: url("https://cdn.jsdelivr.net/gh/ayunami2000/glass-tty-font/Glass_TTY_VT220.ttf");
}

body {
    background: #000;
    margin: 0;
    overflow: hidden;
    font-family: "GlassTTY", monospace;
    font-size: 14px;
    color: #33ff33;
    text-shadow: 0 0 4px #33ff33;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    transform: perspective(900px) translateZ(50px) rotateX(2deg);
}

/* CRT overlays */
body::before,
body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9998;
}

body::after {
    background: repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,0) 2px,
        rgba(0,255,0,0.04) 3px
    );
    mix-blend-mode: overlay;
}

body::before {
    background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.6) 100%);
}

/* VHS glitch overlay */
#vhs-glitch {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    mix-blend-mode: screen;
    opacity: 0;
}

/* Horizontal jitter lines */
.vhs-line {
    position: absolute;
    left: 0;
    width: 100%;
    height: 2px;
    background: rgba(0,255,0,0.2);
    filter: blur(1px);
    opacity: 0;
}

/* RGB split flash */
.rgb-split {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9997;
    mix-blend-mode: lighten;
    opacity: 0;
    backdrop-filter: blur(0.4px);
}

/* Terminal container */
#screen {
    width: 90%;
    height: 90%;
    padding: 20px;
    white-space: pre-wrap;
    overflow-y: auto;
    position: relative;
}

/* Blur wrapper */
#crt {
    filter: blur(0.6px);
    text-shadow:
        0 0 4px #33ff33,
        1px 0 1px rgba(0,255,0,0.3);
}

.cursor {
    display: inline-block;
    width: 10px;
    height: 16px;
    background: #33ff33;
    animation: blink 0.7s steps(1) infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

/* VHS keyframes */
@keyframes vhsFlash {
    0% { opacity: 0; transform: translateX(0); }
    10% { opacity: 0.4; transform: translateX(-3px); }
    20% { opacity: 0.2; transform: translateX(3px); }
    30% { opacity: 0; transform: translateX(0); }
}

@keyframes vhsLine {
    0% { opacity: 0; transform: translateX(0); }
    50% { opacity: 0.4; transform: translateX(-10px); }
    100% { opacity: 0; transform: translateX(0); }
}
</style>
</head>

<body>

<div id="screen"><div id="crt"></div></div>

<!-- VHS glitch layers -->
<div id="vhs-glitch"></div>
<div class="rgb-split" id="rgb"></div>

<script>
const screen = document.getElementById("crt");
let inputActive = false;
let currentInput = "";

/* Fake textfiles */
const files = {
    test1: "This is Test1.\nA clue lies within.",
    test2: "This is Test2.\nAnother piece of the puzzle.",
    test3: "This is Test3.\nYou're getting closer."
};

/* VHS GLITCH SYSTEM */
function triggerVHS() {
    const glitch = document.getElementById("vhs-glitch");
    const rgb = document.getElementById("rgb");

    // Random horizontal lines
    glitch.innerHTML = "";
    const count = Math.floor(Math.random() * 4) + 1;
    for (let i = 0; i < count; i++) {
        const line = document.createElement("div");
        line.className = "vhs-line";
        line.style.top = Math.random() * 100 + "%";
        line.style.animation = `vhsLine 0.2s ease-out`;
        glitch.appendChild(line);
    }

    // RGB split flash
    rgb.style.animation = "vhsFlash 0.25s ease-out";

    // Reset after animation
    setTimeout(() => {
        rgb.style.animation = "";
        glitch.innerHTML = "";
    }, 300);
}

// Trigger glitch randomly every 2–6 seconds
setInterval(() => {
    if (Math.random() < 0.5) triggerVHS();
}, 2000);

/* Boot animation */
async function bootSequence() {
    screen.textContent = "Booting System...\n\n[";
    let bar = "";
    for (let i = 0; i < 30; i++) {
        bar += "#";
        screen.textContent = "Booting System...\n\n[" + bar.padEnd(30, " ") + "]";
        await new Promise(r => setTimeout(r, 80));
    }
    screen.textContent += "\n\nSystem Ready.\nType 'help' for commands.\n\n";
    newPrompt();
}

/* Prompt */
function newPrompt() {
    inputActive = true;
    currentInput = "";

    const line = document.createElement("div");
    line.innerHTML = `C:\\> <span class="input"></span><span class="cursor"></span>`;
    screen.appendChild(line);

    screen.parentElement.scrollTop = screen.parentElement.scrollHeight;
}

/* Commands */
function runCommand(cmd) {
    const lower = cmd.toLowerCase().trim();

    if (lower === "") return "";

    if (lower === "help") {
        return "Commands:\nhelp\ndir\nopen <filename>\nclear";
    }

    if (lower === "dir") {
        return "Files:\n" + Object.keys(files).map(f => f.toUpperCase()).join("\n");
    }

    if (lower.startsWith("open ")) {
        const name = lower.split(" ")[1];
        return files[name] || "File not found.";
    }

    if (lower === "clear") {
        screen.textContent = "";
        return "";
    }

    return "Unknown command.";
}

/* Input handler */
document.addEventListener("keydown", e => {
    if (!inputActive) return;

    const inputs = screen.querySelectorAll(".input");
    const cursors = screen.querySelectorAll(".cursor");
    const inputSpan = inputs[inputs.length - 1];

    if (!inputSpan) return;

    if (e.key === "Backspace") {
        e.preventDefault();
        currentInput = currentInput.slice(0, -1);
        inputSpan.textContent = currentInput;
        return;
    }

    if (e.key === "Enter") {
        e.preventDefault();
        inputActive = false;

        const cursor = cursors[cursors.length - 1];
        if (cursor) cursor.remove();

        const output = runCommand(currentInput);

        if (output !== "") {
            const out = document.createElement("div");
            out.textContent = output;
            screen.appendChild(out);
        }

        screen.appendChild(document.createElement("br"));
        newPrompt();
        return;
    }

    if (e.key.length === 1) {
        currentInput += e.key;
        inputSpan.textContent = currentInput;
    }

    screen.parentElement.scrollTop = screen.parentElement.scrollHeight;
});

bootSequence();
</script>

</body>
</html>
