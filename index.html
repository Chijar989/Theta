<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Retro Terminal</title>
<style>
    body {
        background: #000;
        color: #33ff33;
        font-family: "Courier New", monospace;
        font-size: 20px;
        padding: 20px;
        overflow: hidden;
        text-shadow: 0 0 5px #33ff33;
    }

    /* Scanlines */
    body::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background: repeating-linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0) 0px,
            rgba(0, 0, 0, 0) 2px,
            rgba(0, 255, 0, 0.05) 3px
        );
    }

    /* Flicker animation */
    @keyframes flicker {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.95; }
        80% { opacity: 0.9; }
    }
    #screen {
        animation: flicker 0.2s infinite;
        white-space: pre-wrap;
    }

    /* Blinking cursor */
    .cursor {
        display: inline-block;
        width: 10px;
        background: #33ff33;
        margin-left: 5px;
        animation: blink 0.8s steps(1) infinite;
    }
    @keyframes blink {
        50% { opacity: 0; }
    }
</style>
</head>
<body>
<div id="screen"></div>

<script>
const text = `
Initializing MS-DOS v6.22...
----------------------------------

C:\\> dir
 Volume in drive C is SYSTEM
 Directory of C:\\

AUTOEXEC.BAT
COMMAND.COM
CONFIG.SYS
SYSTEM32
GAMES
LOGS

C:\\> _`;

let i = 0;
const speed = 35;
const screen = document.getElementById("screen");

function type() {
    if (i < text.length) {
        screen.textContent += text.charAt(i);
        i++;
        setTimeout(type, speed);
    } else {
        screen.innerHTML += '<span class="cursor"></span>';
    }
}

type();
</script>
</body>
</html>
